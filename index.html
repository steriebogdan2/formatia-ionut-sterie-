    <!--
      Icons & install manifest.

      Every href is root-relative, so the same icons resolve on nested routes
      such as /servicii/nunti. `shortcut icon` is kept for older browsers that
      ignore the sized variants.
    -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="Ionut Sterie" />
    <meta name="application-name" content="Formația Ionut Sterie" />

    <!--
      Performance: open the connections the first paint depends on, then start
      the hero image immediately so it is never queued behind the JS bundle.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://i.imgur.com" />
    <link
      rel="preload"
      as="image"
      href="https://i.imgur.com/JJhl0xt.jpeg"
      fetchpriority="high"
    />

    <!--
      Fonts are linked here rather than @import-ed from the CSS: the preload
      scanner can then request them while the HTML is still parsing, instead of
      waiting for the stylesheet to download and parse. Only the weights the
      site actually renders are requested.
    -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Montserrat:wght@400;500;700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Montserrat:wght@400;500;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Montserrat:wght@400;500;700&display=swap"
      />
    </noscript>
